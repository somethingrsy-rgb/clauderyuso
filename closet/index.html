<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)">
<title>내 옷장</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div>
    <p class="eyebrow" id="eyebrow">THIS WEEK</p>
    <h1 id="title">주간</h1>
  </div>
  <div class="top-r"><span id="count" class="count" hidden></span><button id="acct" class="acct" type="button" aria-label="계정">로그인</button></div>
</header>

<main>
  <section id="tab-closet" class="tab">
    <div class="chips scroll" id="filter-cat"></div>
    <div class="tools">
      <label class="s">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="이름·색상으로 검색" autocomplete="off" aria-label="옷 검색">
      </label>
      <select id="sort" aria-label="정렬"><option value="cat">종류순</option><option value="new">최신순</option><option value="name">이름순</option></select>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" hidden>
      <svg viewBox="0 0 64 64" width="72" height="72" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M32 14a5 5 0 1 1 5 5v4l20 12c3 2 1.6 6-1.6 6H8.6C5.4 41 4 37 7 35l20-12v-4"/><path d="M14 41v9h36v-9"/></svg>
      <h3>옷장이 비어 있어요</h3>
      <p>가진 옷을 사진으로 등록하면<br>날씨에 맞는 코디를 추천해 드려요.</p>
      <button class="primary" id="empty-add">첫 옷 등록하기</button>
    </div>
  </section>

  <section id="tab-week" class="tab active">
    <div class="panel bar">
      <p class="muted sm" id="week-sum"></p>
      <button id="btn-clear-week" class="ghost small">모두 비우기</button>
    </div>
    <div id="week-grid" class="weekplan"></div>
  </section>

  <section id="tab-combo" class="tab">
    <div id="combo-list" class="combos"></div>
    <div class="row" style="padding:12px 22px 0"><button id="btn-new-combo" class="ghost">＋ 새 코디 만들기</button></div>
  </section>
</main>

<button id="fab" class="fab" aria-label="옷 추가" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="dock">
  <button data-tab="week" class="active" aria-label="주간">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
    <span>주간</span>
  </button>
  <button data-tab="combo" aria-label="코디">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3 4 6l1.5 4L8 9v11h8V9l2.5 1L20 6l-5-3c-.5 1.3-1.6 2-3 2s-2.5-.7-3-2Z"/></svg>
    <span>코디</span>
  </button>
  <button data-tab="closet" aria-label="옷장">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5a2 2 0 1 1 2 2v1.2l7 4.2c1.2.7.7 2.5-.7 2.5H3.7c-1.4 0-1.9-1.8-.7-2.5l7-4.2"/></svg>
    <span>옷장</span>
  </button>
</nav>

<dialog id="dlg">
  <form method="dialog" id="form">
    <div class="sheet-head">
      <h2 id="dlg-title">옷 추가</h2>
      <button type="button" id="btn-cancel" class="icon" aria-label="닫기">✕</button>
    </div>
    <label class="drop" id="drop">
      <img id="preview" alt="" hidden>
      <canvas id="bg-canvas" hidden aria-label="배경을 지운 미리보기. 남은 배경을 누르면 지워져요"></canvas>
      <span id="drop-hint">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg>
        사진 촬영 / 선택
      </span>
      <input type="file" id="photo" accept="image/*">
    </label>
    <div class="bgtools" id="bg-tools" hidden>
      <div class="row">
        <button type="button" id="bg-auto" class="chip on">배경 지우기</button>
        <button type="button" id="bg-undo" class="chip" disabled>되돌리기</button>
        <button type="button" id="bg-reset" class="chip" disabled>원본으로</button>
        <button type="button" id="bg-change" class="chip">사진 바꾸기</button>
      </div>
      <label class="field"><span class="lbl">지우기 강도 <b id="bg-tol-v">24</b></span>
        <input type="range" id="bg-tol" min="8" max="70" value="24"></label>
      <p id="bg-msg" class="muted sm">배경이 단색이면 한 번에 지워져요. 강도가 높을수록 비슷한 색을 더 많이 지워요.</p>
    </div>
    <label class="field"><span class="lbl">이름</span>
      <input id="f-name" placeholder="예: 흰색 옥스포드 셔츠" autocomplete="off"></label>
    <div class="field"><span class="lbl">종류</span><div class="chips" id="f-cat"></div></div>
    <div class="field"><span class="lbl">색상 <b id="color-name"></b></span><div class="swatches" id="f-color"></div></div>
    <div class="field"><span class="lbl">입는 계절</span><div class="chips" id="f-seasons"></div></div>
    <div class="row end">
      <button type="button" id="btn-del" class="danger small" hidden>삭제</button>
      <span class="spacer"></span>
      <button type="submit" class="primary">저장</button>
    </div>
  </form>
</dialog>

<dialog id="d-pick"><div class="sheet-pad">
  <div class="sheet-head"><h2 id="pk-title">코디</h2><button type="button" class="icon" data-close aria-label="닫기">✕</button></div>
  <label class="field" id="pk-name-wrap" hidden><span class="lbl">코디 이름</span><input id="pk-name" placeholder="예: 출근할 때 입는 코디" autocomplete="off"></label>
  <div class="pk-sel" id="pk-sel"></div>
  <div class="chips" id="pk-cats"></div>
  <div class="pk-grid" id="pk-grid"></div>
  <div class="pk-save" id="pk-save" hidden>
    <input id="pk-combo-name" placeholder="코디로 등록할 이름" autocomplete="off">
    <button type="button" class="ghost small" id="pk-save-btn">코디로 등록</button>
  </div>
  <div class="row end" id="pk-acts"></div>
</div></dialog>

<dialog id="d-apply"><div class="sheet-pad">
  <div class="sheet-head"><h2 id="ap-title">코디 불러오기</h2><button type="button" class="icon" data-close aria-label="닫기">✕</button></div>
  <div class="ap-list" id="ap-list"></div>
</div></dialog>

<dialog id="d-acct"><div class="sheet-pad">
  <div class="sheet-head"><h2>계정</h2><button type="button" class="icon" data-close aria-label="닫기">✕</button></div>
  <div id="acct-body" class="acct-body"></div>
</div></dialog>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="bgcut.js"></script>
<script src="planner.js"></script>
<script src="app.js"></script>
</body>
</html>
